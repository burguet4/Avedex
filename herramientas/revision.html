<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de recortes</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.3 system-ui, sans-serif; background: #f2f5f4; color: #173F3B; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #4D746F; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  figure { margin: 0; padding: 6px; background: #fff; border-radius: 10px; border: 2px solid transparent; }
  figure.duda { border-color: #E7B416; }
  .caja { height: 130px; display: grid; place-items: center;
    background: repeating-conic-gradient(#e9eeec 0 25%, #fff 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
  .caja img { max-width: 100%; max-height: 100%; }
  figcaption { margin-top: 4px; font-size: 12px; }
  b { font-variant-numeric: tabular-nums; }
  label { display: inline-flex; gap: 6px; align-items: center; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Revisión de recortes</h1>
<p>Abre esta página con el servidor en marcha: http://localhost:8000/herramientas/revision.html. Borde amarillo = marcado como dudoso.</p>
<label><input type="checkbox" id="solo"> Ver solo los dudosos</label>
<div class="rejilla" id="rejilla"></div>
<script>
const DUDOSOS = new Set(["anas-platyrhynchos","anas-acuta","aythya-marila","ardenna-gravis","puffinus-puffinus","milvus-migrans","falco-subbuteo","falco-peregrinus","calidris-pugnax","locustella-naevia","certhia-familiaris","sturnus-unicolor","loxia-curvirostra","spinus-spinus"]);
fetch("../datos/especies.json").then(r => r.json()).then(({ especies }) => {
  const pintar = () => {
    const solo = document.getElementById("solo").checked;
    document.getElementById("rejilla").innerHTML = especies
      .filter(e => !solo || DUDOSOS.has(e.id))
      .map(e => `<figure class="${DUDOSOS.has(e.id) ? "duda" : ""}"><div class="caja"><img loading="lazy" src="../${e.imagen}" alt=""></div>
        <figcaption><b>${String(e.numero).padStart(3, "0")}</b> ${e.nombre}<br><small>${e.id}</small></figcaption></figure>`).join("");
  };
  document.getElementById("solo").onchange = pintar;
  pintar();
});
</script>
</body>
</html>
