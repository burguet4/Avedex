<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisión de imágenes · Avedex</title>
  <style>
    body { margin: 0; padding: 16px; font: 14px/1.3 system-ui, sans-serif; background: #F2F1F6; color: #26223F; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 12px; color: #6A6688; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    figure { margin: 0; padding: 6px; border-radius: 10px; background: #fff; }
    .caja { display: grid; place-items: center; height: 130px; border-radius: 6px; background: repeating-conic-gradient(#E9E7F0 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
    .caja img { max-width: 100%; max-height: 100%; }
    figcaption { margin-top: 4px; font-size: 12px; }
    b { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Revisión de imágenes</h1>
  <p>Todas las imágenes recortadas sobre un fondo de cuadros, para comprobar que el fondo se ha quitado bien.</p>
  <div id="rejilla" class="rejilla"></div>
  <script>
    fetch("../datos/especies.json")
      .then((respuesta) => respuesta.json())
      .then(({ especies }) => {
        document.getElementById("rejilla").innerHTML = especies.map((e) => `
          <figure>
            <div class="caja"><img loading="lazy" src="../${e.imagen}" alt=""></div>
            <figcaption><b>${String(e.numero).padStart(3, "0")}</b> ${e.nombre}<br><small>${e.id}</small></figcaption>
          </figure>`).join("");
      });
  </script>
</body>
</html>
